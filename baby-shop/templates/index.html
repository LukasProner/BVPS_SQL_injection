<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>BabyShop</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; margin: 0; padding: 30px; background: #f5f5f5; text-align: center; }
    h1 { margin-bottom: 6px; color: #c9706a; }
    nav { margin: 10px 0 8px; }
    nav a { margin: 0 8px; color: #555; }
    hr { margin: 0 auto 24px; width: 80%; border: none; border-top: 1px solid #ccc; }
    .strollers { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .stroller {
      background: #fff;
      /* border: 1px solid #ddd; */
      border-radius: 7px;
      padding: 15px 16px;
      width: 800px;
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
    }
    .stroller img{ width:80px; height:64px;object-fit:cover;border-radius:6px;flex-shrink:0;}
    .stroller .name { font-weight: bold;font-size:17px;margin-bottom:7px;}
    .stroller .price{ color: #c0392b; font-size:17px;margin-bottom:4px;}
    .stroller .desc{ font-size: 13px; line-height: 1.4; }
  </style>
</head>
<body>

<h1>BabyShop - detske kociky</h1>
<nav>
  <a href="/vulnerable/search">Vyhladavanie (VUL)</a> |
  <a href="/secure/search">Vyhladavanie (SECURE)</a> |
  <a href="/vulnerable/login">Login (VUL)</a> |
  <a href="/secure/login">Login (SECURE)</a>
</nav>
<hr>

<h2>Products</h2>
<div class="strollers">
  {% for p in products %}
  <div class="stroller">
    <img src="/static/stroller.png" alt="{{p['name'] }}">
    <div>
      <div class="name">{{p['name']}}</div>
      <div class="price">{{p['price']}} €</div>
      <div class="desc">{{p['desc']}}</div>
    </div>
  </div>
  {% endfor %}
</div>

</body>
</html>
