<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Search - {{ mode }}</title>
  <style>
    * { box-sizing: border-box; }
    body{font-family:sans-serif;margin:0;padding: 30px;background:#f5f5f5;text-align:center;}
    h1{margin-bottom:6px;color: #c9706a;}
    nav{margin:10px 0 16px;}
    nav a{ margin:0 8px;color: #555;}
    hr{margin:0 auto 24px;width: 80%;border: none;border-top:1px solid #ccc;}
    form{margin-bottom: 20px;}
    table{margin: 0 auto; border-collapse:collapse;background:#fff;border: 1px solid #ddd;border-radius:8px;}
    th,td{padding:8px 14px;border: 1px solid #ddd;font-size:14px;text-align:left;}
    th{background: #f0f0f0;}
    p{color: #555;}
  </style>
</head>
<body>

<h1>BabyShop - Vyhladavanie ({{ mode|upper }})</h1>
<nav>
  <a href="/">Home</a> |
  <a href="/vulnerable/search">Vulnerable</a> |
  <a href="/secure/search">Secure</a> |
  <a href="/vulnerable/login">Login vulnerable</a> |
  <a href="/secure/login">Login secure</a>
</nav>
<hr>

<form method="get">
  Search: <input type="text" name="q" value="{{ q }}" size="60">
  <input type="submit" value="Search">
</form>

{% if rows %}
<table>
  <tr><th>ID</th><th>nazov</th><th>cena</th><th>popis</th></tr>
  {% for r in rows %}
  <tr>
    <td>{{ r[0] }}</td>
    <td>{{ r[1] }}</td>
    <td>{{ r[2] }}</td>
    <td>{{ r[3] }}</td>
  </tr>
  {% endfor %}
</table>
{% elif q %}
<p>Ziadne vysledky.</p>
{% endif %}
</body>
</html>
