<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>BabyShop</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; margin: 0; padding: 30px; background: #f5f5f5; text-align: center; }
    h1 { margin-bottom: 6px; }
    nav { margin: 10px 0 16px; }
    nav a { margin: 0 8px; color: #555; }
    hr { margin: 0 auto 24px; width: 80%; border: none; border-top: 1px solid #ccc; }
    .hero-img { display: block; margin: 0 auto 28px; max-width: 280px; border-radius: 8px; }
    .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; }
    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      width: 220px;
      text-align: left;
    }
    .card .name { font-weight: bold; font-size: 15px; margin-bottom: 6px; }
    .card .price { color: #c0392b; font-size: 17px; margin-bottom: 8px; }
    .card .desc { font-size: 13px; color: #555; line-height: 1.4; }
  </style>
</head>
<body>

<h1>BabyShop – Detské kočíky</h1>
<nav>
  <a href="/vulnerable/search">Vyhľadávanie (VULNERABLE)</a> |
  <a href="/secure/search">Vyhľadávanie (SECURE)</a> |
  <a href="/vulnerable/login">Login (VULNERABLE)</a> |
  <a href="/secure/login">Login (SECURE)</a>
</nav>
<hr>

<img class="hero-img" src="/static/images.jpg" alt="Kočík">

<h2>Produkty</h2>
<div class="grid">
  {% for p in products %}
  <div class="card">
    <div class="name">{{ p['name'] }}</div>
    <div class="price">{{ p['price'] }} €</div>
    <div class="desc">{{ p['description'] }}</div>
  </div>
  {% endfor %}
</div>

</body>
</html>
